<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Create Order</h3>
    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="authorInput">Author</label>
            <input id="authorInput" name="author" class="form-control mb-3 col-6" type="text" required>
        </div>
        <div class="form-group">
            <label for="productNameInput">Product Name</label>
            <input id="productNameInput" name="productName" class="form-control mb-3 col-6" type="text" required>
        </div>
        <div class="form-group">
            <label for="productQuantityInput">Product Quantity</label>
            <input id="productQuantityInput" name="productQuantity" class="form-control mb-3 col-6" type="number" min="1" required>
        </div>
        <button id="createOrderButton" type="submit" class="btn btn-primary">Create Order</button>
    </form>
</div>
</body>
</html>
