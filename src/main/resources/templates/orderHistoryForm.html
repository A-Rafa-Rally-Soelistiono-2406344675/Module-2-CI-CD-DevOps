<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Find Order History</h3>
    <form th:action="@{/order/history}" method="post">
        <div class="form-group">
            <label for="authorInput">Author</label>
            <input id="authorInput" name="author" class="form-control mb-3 col-6" type="text" required>
        </div>
        <button id="searchHistoryButton" type="submit" class="btn btn-primary">Search</button>
    </form>
</div>
</body>
</html>
