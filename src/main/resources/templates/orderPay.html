<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Payment</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Pay Order</h3>
    <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
    <p><strong>Author:</strong> <span th:text="${order.author}"></span></p>

    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
        <div class="form-group">
            <label for="methodSelect">Payment Method</label>
            <select id="methodSelect" name="method" class="form-control col-6">
                <option value="Voucher Code">Voucher Code</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
            </select>
        </div>

        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code</label>
            <input id="voucherCodeInput" name="voucherCode" class="form-control col-6" type="text">
        </div>

        <div class="form-group">
            <label for="addressInput">Address</label>
            <input id="addressInput" name="address" class="form-control col-6" type="text">
        </div>

        <div class="form-group">
            <label for="deliveryFeeInput">Delivery Fee</label>
            <input id="deliveryFeeInput" name="deliveryFee" class="form-control col-6" type="text">
        </div>

        <button id="payOrderButton" type="submit" class="btn btn-primary">Pay</button>
    </form>
</div>
</body>
</html>
