<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Payment Admin Detail</h3>

    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Order ID</th>
            <td th:text="${payment.order.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
    </table>

    <form th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}" method="post">
        <div class="form-group">
            <label for="statusSelect">Set Status</label>
            <select id="statusSelect" name="status" class="form-control col-4">
                <option value="SUCCESS">SUCCESS</option>
                <option value="REJECTED">REJECTED</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Status</button>
    </form>
</div>
</body>
</html>
