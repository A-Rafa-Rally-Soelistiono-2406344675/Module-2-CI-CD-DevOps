<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail Result</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Payment Detail</h3>

    <div th:if="${payment == null}" class="alert alert-warning">
        Payment not found.
    </div>

    <table th:if="${payment != null}" class="table table-striped">
        <tr>
            <th>ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
        <tr>
            <th>Order ID</th>
            <td th:text="${payment.order.id}"></td>
        </tr>
    </table>
</div>
</body>
</html>
